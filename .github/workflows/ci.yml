name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "codex/**"]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Transiever.SaslClient.slnx

      - name: Build
        run: dotnet build Transiever.SaslClient.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Transiever.SaslClient.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Transiever.SaslClient/Transiever.SaslClient.csproj --configuration Release --no-build --output out
